<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CUNY SPS Club Social Hub</title>
    <script type="text/javascript">
      (function() {
        var l = window.location;
        var parts = l.pathname.split('/').filter(Boolean);
        var repo = parts.length > 0 ? '/' + parts[0] : '';
        var subpath = parts.slice(1).join('/');
        var targetHash = subpath ? ('#' + subpath) : (l.hash || '#clubs');
        var query = l.search || '';
        l.replace(l.protocol + '//' + l.host + repo + '/' + targetHash + query);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to CUNY SPS Club Social Hub...</p>
  </body>
</html>
